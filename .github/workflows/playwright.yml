name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # nightly, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Locally the config uses the installed Chrome (channel: 'chrome').
      # In CI we install Playwright's Chromium and tell the config to use it instead.
      - name: Run tests
        run: npx playwright test
        env:
          CI: true
          PW_USE_BUNDLED_CHROMIUM: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
